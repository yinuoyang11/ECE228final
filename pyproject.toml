[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_policy_pi0_lite_flow"
version = "0.1.0"
description = "LeRobot-style pi0-lite conditional flow matching action decoder."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch==2.7.1",
    "torchcodec==0.5.0; sys_platform != 'win32'",
    "einops>=0.7",
    "lerobot==0.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
encoder = [
    "transformers==5.3.0",
    "torchvision==0.22.1",
    "datasets>=2.19",
    "huggingface-hub>=0.23",
    "accelerate>=0.30",
    "safetensors>=0.4",
    "av>=12.0",
    "qwen-vl-utils>=0.0.8",
    "peft>=0.17.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
